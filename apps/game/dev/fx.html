<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Fire and Smoke Tests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./dev.css">
</head>
<body class="bg-bg text-[15px]/[1.4] text-text h-full">
  <header class="flex flex-wrap items-baseline gap-x-4 gap-y-1.5 px-4 pb-2 pt-3">
    <h1 class="text-[22px] font-bold tracking-[0.02em]">Fire and smoke tests</h1>
    <p class="text-muted">A Jackal shelling a different building in each impact look (top row), and the Unity Labs flipbooks (CC0) against the current particles on the refinery. Each row loops.</p>
  </header>
  <div id="view" class="relative mx-4 flex-1 overflow-hidden rounded-[6px] border border-line min-h-[320px]"><div class="pointer-events-none absolute inset-0" id="labels"></div></div>
  <footer class="flex flex-wrap items-center gap-x-3.5 gap-y-2 px-4 pb-3.5 pt-2.5">
    <button class="cursor-pointer rounded-[4px] border border-line bg-panel px-3 py-1 font-semibold text-text hover:border-gold [&.primary]:min-w-[72px] [&.primary]:border-gold [&.primary]:bg-gold [&.primary]:text-ink primary" id="play">Pause</button>
    <label class="inline-flex items-center gap-1.5 text-muted">Zoom <select class="rounded-[4px] border border-line bg-panel px-1.5 py-[3px] text-text" id="zoom"><option value="0.6">far</option><option value="1">game default</option><option value="1.4" selected>close</option><option value="2.2">closest</option></select></label>
    <p class="text-muted">Drag to pan.</p>
  </footer>
  <script type="module" src="/src/dev/nav.ts"></script>
</body>
</html>
