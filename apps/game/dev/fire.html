<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Fire Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./dev.css">
</head>
<body class="bg-bg text-[15px]/[1.4] text-text h-full">
  <header class="flex flex-wrap items-baseline gap-x-4 gap-y-1.5 px-4 pb-2 pt-3">
    <h1 class="text-[22px] font-bold tracking-[0.02em]">Fire playground</h1>
    <p class="text-muted">Change the fire and smoke on the refinery's three burning spots. Settings are kept in this browser.</p>
  </header>
  <main class="flex min-h-0 flex-1 gap-3 px-4 pb-3.5 narrow:flex-col">
    <div id="view" class="relative min-w-0 flex-1 overflow-hidden rounded-[6px] border border-line"></div>
    <aside id="panel" class="w-[320px] flex-none overflow-y-auto rounded-[6px] border border-line bg-panel px-3 py-2.5 narrow:max-h-[45vh] narrow:w-auto"></aside>
  </main>
  <script type="module" src="/src/dev/nav.ts"></script>
</body>
</html>
