<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Unit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./dev.css">
</head>
<body class="bg-bg text-[15px]/[1.4] text-text h-full">
  <header class="flex flex-wrap items-baseline gap-x-4 gap-y-1.5 px-4 pb-2 pt-3">
    <h1 id="title" class="text-[22px] font-bold tracking-[0.02em]">Unit</h1>
    <nav class="ml-2 flex gap-1" id="tabs"><a class="rounded-full border border-line px-3.5 py-[3px] font-semibold text-muted hover:border-gold [&.on]:border-gold [&.on]:bg-gold [&.on]:text-ink" data-mode="animation" hidden>Animation</a><a class="rounded-full border border-line px-3.5 py-[3px] font-semibold text-muted hover:border-gold [&.on]:border-gold [&.on]:bg-gold [&.on]:text-ink" data-mode="picture" hidden>Picture</a><a class="rounded-full border border-line px-3.5 py-[3px] font-semibold text-muted hover:border-gold [&.on]:border-gold [&.on]:bg-gold [&.on]:text-ink" data-mode="model" hidden>3D model</a></nav>
    <p id="blurb" class="text-muted"></p>
    <p id="about" class="basis-full [&_span]:text-muted"></p>
  </header>
  <div id="view" class="relative mx-4 flex-1 overflow-hidden rounded-[6px] border border-line flex min-h-[420px] flex-col"></div>
  <section id="details" class="mx-4 mb-6 mt-3.5 grid max-w-[760px] gap-2.5"></section>
  <section id="info" class="mx-4 mb-6 mt-1 flex flex-wrap items-start gap-5" hidden></section>
  <script type="module" src="/src/dev/nav.ts"></script>
</body>
</html>
