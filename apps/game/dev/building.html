<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Building</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./dev.css">
</head>
<body class="bg-bg text-[15px]/[1.4] text-text h-full">
  <header class="flex flex-wrap items-baseline gap-x-4 gap-y-1.5 px-4 pb-2 pt-3">
    <h1 id="title" class="text-[22px] font-bold tracking-[0.02em]">Building</h1>
    <nav class="ml-2 flex gap-1" id="tabs"><a class="rounded-full border border-line px-3.5 py-[3px] font-semibold text-muted hover:border-gold [&.on]:border-gold [&.on]:bg-gold [&.on]:text-ink" data-mode="model" hidden>3D model</a><a class="rounded-full border border-line px-3.5 py-[3px] font-semibold text-muted hover:border-gold [&.on]:border-gold [&.on]:bg-gold [&.on]:text-ink" data-mode="picture" hidden>Picture</a><a class="rounded-full border border-line px-3.5 py-[3px] font-semibold text-muted hover:border-gold [&.on]:border-gold [&.on]:bg-gold [&.on]:text-ink" data-mode="idle" hidden>Animation</a><a class="rounded-full border border-line px-3.5 py-[3px] font-semibold text-muted hover:border-gold [&.on]:border-gold [&.on]:bg-gold [&.on]:text-ink" data-mode="construction">Construction</a><a class="rounded-full border border-line px-3.5 py-[3px] font-semibold text-muted hover:border-gold [&.on]:border-gold [&.on]:bg-gold [&.on]:text-ink" data-mode="destruction">Destruction</a><a class="rounded-full border border-line px-3.5 py-[3px] font-semibold text-muted hover:border-gold [&.on]:border-gold [&.on]:bg-gold [&.on]:text-ink" data-mode="turret" hidden>Turret</a></nav>
    <p id="blurb" class="text-muted"></p>
    <p id="about" class="basis-full [&_span]:text-muted"></p>
  </header>
  <div id="view" class="relative mx-4 flex-1 overflow-hidden rounded-[6px] border border-line min-h-[320px]"><div class="pointer-events-none absolute inset-0" id="labels"></div></div>
  <section id="info" class="mx-4 mb-6 mt-1 flex flex-wrap items-start gap-5" hidden></section>
  <footer class="grid gap-2 px-4 pb-3.5 pt-2.5">
    <div class="flex flex-wrap items-center gap-x-3.5 gap-y-2">
      <button class="cursor-pointer rounded-[4px] border border-line bg-panel px-3 py-1 font-semibold text-text hover:border-gold [&.primary]:min-w-[72px] [&.primary]:border-gold [&.primary]:bg-gold [&.primary]:text-ink primary" id="play">Pause</button>
      <button class="cursor-pointer rounded-[4px] border border-line bg-panel px-3 py-1 font-semibold text-text hover:border-gold [&.primary]:min-w-[72px] [&.primary]:border-gold [&.primary]:bg-gold [&.primary]:text-ink" id="restart" title="Start again (R)">Restart</button>
      <span class="flex flex-wrap items-center gap-x-3.5 gap-y-2" data-mode="construction">
        <button class="cursor-pointer rounded-[4px] border border-line bg-panel px-3 py-1 font-semibold text-text hover:border-gold [&.primary]:min-w-[72px] [&.primary]:border-gold [&.primary]:bg-gold [&.primary]:text-ink" id="prev" title="Previous stage (←)">◀ Stage</button>
        <button class="cursor-pointer rounded-[4px] border border-line bg-panel px-3 py-1 font-semibold text-text hover:border-gold [&.primary]:min-w-[72px] [&.primary]:border-gold [&.primary]:bg-gold [&.primary]:text-ink" id="next" title="Next stage (→)">Stage ▶</button>
      </span>
      <input class="m-0.5 min-w-[200px] flex-1 accent-gold" id="scrub" data-mode="construction" type="range" min="0" max="1000" value="0" aria-label="Build progress">
      <span class="min-w-[44px] text-right tabular-nums" id="pct" data-mode="construction">0%</span>
    </div>
    <div class="flex flex-wrap items-center gap-x-3.5 gap-y-2">
      <label class="inline-flex items-center gap-1.5 text-muted" data-mode="construction">Build time <select class="rounded-[4px] border border-line bg-panel px-1.5 py-[3px] text-text" id="time"><option value="5">5 s</option><option value="10" selected>10 s</option><option value="20">20 s</option><option value="40">40 s</option></select></label>
      <label class="inline-flex items-center gap-1.5 text-muted" data-mode="construction">Speed <select class="rounded-[4px] border border-line bg-panel px-1.5 py-[3px] text-text" id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
      <label class="inline-flex items-center gap-1.5 text-muted">Zoom <select class="rounded-[4px] border border-line bg-panel px-1.5 py-[3px] text-text" id="zoom"><option value="0.5">far</option><option value="1" selected>game (start)</option><option id="zoommax">game (closest)</option><option value="2">close</option><option value="3">closest</option></select></label>
      <label class="inline-flex items-center gap-1.5 text-muted" data-mode="turret">Turn <select class="rounded-[4px] border border-line bg-panel px-1.5 py-[3px] text-text" id="turn"><option value="sweep" selected>sweep round</option><option value="scan">scan side to side</option><option value="mouse">follow the mouse</option></select></label>
      <label class="inline-flex items-center gap-1.5 text-muted" data-mode="turret">Speed <select class="rounded-[4px] border border-line bg-panel px-1.5 py-[3px] text-text" id="turnspeed"><option value="45">45°/s</option><option value="90" selected>90°/s</option><option value="180">180°/s</option></select></label>
      <label class="inline-flex items-center gap-1.5 text-muted" data-mode="construction destruction"><input type="checkbox" class="m-[3px_3px_3px_4px]" id="loop" checked> Loop</label>
      <label class="inline-flex items-center gap-1.5 text-muted" data-mode="idle"><input type="checkbox" class="m-[3px_3px_3px_4px]" id="powered" checked> Powered</label>
      <label class="inline-flex items-center gap-1.5 text-muted" data-mode="idle"><input type="checkbox" class="m-[3px_3px_3px_4px]" id="working" checked> Working</label>
      <label class="inline-flex items-center gap-1.5 text-muted" data-mode="idle"><input type="checkbox" class="m-[3px_3px_3px_4px]" id="dooropen"> Door open</label>
      <span class="flex flex-wrap items-center gap-x-3.5 gap-y-2" id="traffic" data-mode="idle">
        <label class="inline-flex items-center gap-1.5 text-muted">Unit <select class="rounded-[4px] border border-line bg-panel px-1.5 py-[3px] text-text" id="tripunit"></select></label>
        <button class="cursor-pointer rounded-[4px] border border-line bg-panel px-3 py-1 font-semibold text-text hover:border-gold [&.primary]:min-w-[72px] [&.primary]:border-gold [&.primary]:bg-gold [&.primary]:text-ink" id="send" title="Send the unit again">Send</button>
        <label class="inline-flex items-center gap-1.5 text-muted"><input type="checkbox" class="m-[3px_3px_3px_4px]" id="repeat" checked> Repeat</label>
      </span>
      <label class="inline-flex items-center gap-1.5 text-muted"><input type="checkbox" class="m-[3px_3px_3px_4px]" id="footprint"> Footprint</label>
    </div>
    <div class="flex flex-wrap gap-1.5" id="chips"></div>
  </footer>
  <script type="module" src="/src/dev/nav.ts"></script>
</body>
</html>
