<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Building</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./dev.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    .tabs { display: flex; gap: 4px; margin-left: 8px; }
    .tabs a { padding: 3px 14px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-weight: 600; }
    .tabs a:hover { text-decoration: none; border-color: var(--gold); }
    .tabs a.on { background: var(--gold); border-color: var(--gold); color: #1a1406; }
    #view { position: relative; flex: 1; min-height: 320px; margin: 0 16px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    #view canvas { display: block; }
    .labels { position: absolute; inset: 0; pointer-events: none; }
    .label { position: absolute; transform: translate(-50%, 0); padding: 2px 8px; border-radius: 4px; background: rgba(18, 19, 21, 0.75); font-weight: 600; white-space: nowrap; }
    .label small { color: var(--muted); font-weight: 500; margin-left: 6px; }
    footer { padding: 10px 16px 14px; display: grid; gap: 8px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    [hidden] { display: none !important; }
    header p.about { flex-basis: 100%; color: var(--text); }
    header p.about span { color: var(--muted); }
    #scrub { flex: 1; min-width: 200px; accent-color: var(--gold); }
    #pct { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
    .chip.done { color: var(--text); }
    .chip.now { color: #1a1406; background: var(--gold); border-color: var(--gold); }
    button.chip { font-weight: 500; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Building</h1>
    <nav class="tabs" id="tabs"><a data-mode="model" hidden>3D model</a><a data-mode="picture" hidden>Picture</a><a data-mode="idle" hidden>Animation</a><a data-mode="construction">Construction</a><a data-mode="destruction">Destruction</a><a data-mode="turret" hidden>Turret</a></nav>
    <p id="blurb"></p>
    <p id="about" class="about"></p>
  </header>
  <div id="view"><div class="labels" id="labels"></div></div>
  <section id="info" class="info" hidden></section>
  <footer>
    <div class="row">
      <button class="primary" id="play">Pause</button>
      <button id="restart" title="Start again (R)">Restart</button>
      <span class="row" data-mode="construction">
        <button id="prev" title="Previous stage (←)">◀ Stage</button>
        <button id="next" title="Next stage (→)">Stage ▶</button>
      </span>
      <input id="scrub" data-mode="construction" type="range" min="0" max="1000" value="0" aria-label="Build progress">
      <span id="pct" data-mode="construction">0%</span>
    </div>
    <div class="row">
      <label data-mode="construction">Build time <select id="time"><option value="5">5 s</option><option value="10" selected>10 s</option><option value="20">20 s</option><option value="40">40 s</option></select></label>
      <label data-mode="construction">Speed <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
      <label>Zoom <select id="zoom"><option value="0.5">far</option><option value="1">game default</option><option value="2" selected>close</option><option value="3">closest</option></select></label>
      <label data-mode="turret">Turn <select id="turn"><option value="sweep" selected>sweep round</option><option value="scan">scan side to side</option><option value="mouse">follow the mouse</option></select></label>
      <label data-mode="turret">Speed <select id="turnspeed"><option value="45">45°/s</option><option value="90" selected>90°/s</option><option value="180">180°/s</option></select></label>
      <label data-mode="construction destruction"><input type="checkbox" id="loop" checked> Loop</label>
      <label data-mode="idle"><input type="checkbox" id="powered" checked> Powered</label>
      <label data-mode="idle"><input type="checkbox" id="working" checked> Working</label>
      <label data-mode="idle"><input type="checkbox" id="dooropen"> Door open</label>
      <span class="row" id="traffic" data-mode="idle">
        <label>Unit <select id="tripunit"></select></label>
        <button id="send" title="Send the unit again">Send</button>
        <label><input type="checkbox" id="repeat" checked> Repeat</label>
      </span>
      <label><input type="checkbox" id="footprint"> Footprint</label>
    </div>
    <div class="chips" id="chips"></div>
  </footer>
  <script type="module" src="/src/dev/nav.ts"></script>
</body>
</html>
